name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install static checker
        run: python -m pip install ruff==0.17.0
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Compile source
        run: python -m compileall -q .
      - name: Check approval boundaries
        env:
          PYTHONPATH: ..
        run: python -m unittest astrbot_plugin_capability_bridge.tests.test_policy -v
